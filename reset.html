<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reset your Math Wizard password">
    <title>Math Wizard - Restore Your Spell</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/tailwind-config.js"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js"></script>
    <script src="assets/js/firebaseConfig.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@400;700;900&family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="antialiased">
    <div class="fixed inset-0 pointer-events-none z-0">
        <div class="absolute inset-0 bg-tech-grid"></div>
        <div class="absolute top-0 right-0 w-[500px] h-[500px] bg-ncst-blue rounded-full filter blur-[120px] opacity-40"></div>
        <div class="absolute bottom-0 left-0 w-[500px] h-[500px] bg-ncst-neon rounded-full filter blur-[120px] opacity-10"></div>
    </div>

    <nav class="fixed top-0 w-full z-50 bg-ncst-dark/95 border-b border-ncst-neon/20" style="box-shadow: 0 2px 20px rgba(0,0,0,0.8), 0 1px 0 rgba(201,168,76,0.1);">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 sm:h-20 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3 logo-container group hover:opacity-90 transition-opacity">
                <img src="assets/img/logo.png" alt="Math Wizard Logo" class="w-8 sm:w-10 h-8 sm:h-10 logo-image transition-all duration-500 group-hover:drop-shadow-[0_0_8px_#C9A84C]">
                <div>
                    <h1 class="font-magic text-lg sm:text-xl text-white tracking-widest">Math<span class="text-ncst-gold">Wizard</span></h1>
                    <p class="text-[0.5rem] sm:text-[0.6rem] uppercase tracking-[0.2em] text-ncst-neon font-bold">The Era Of Mages</p>
                </div>
            </a>
            <a href="auth.html" class="text-xs sm:text-sm uppercase tracking-widest text-ncst-neon hover:text-ncst-gold transition-colors">
                <i class="fa-solid fa-arrow-left sm:mr-2"></i><span class="hidden sm:inline"> Back to Login</span>
            </a>
        </div>
    </nav>

    <main class="relative z-10 min-h-screen flex items-center justify-center pt-20 px-4 sm:px-6">
        <section class="parchment-panel p-6 sm:p-8 max-w-md w-full animate-fadeInLeft" aria-labelledby="reset-title">
            <div id="reset-form-state">
                <div class="text-center mb-8">
                    <div class="wax-seal wax-seal-gold mx-auto mb-4"><i class="fa-solid fa-key"></i></div>
                    <h2 id="reset-title" class="font-magic text-3xl sm:text-4xl text-ncst-gold text-gold-glow mb-2">Restore Your Spell</h2>
                    <p class="font-flavor italic text-sm" style="color:#a08060;">Choose a new password for your Math Wizard account.</p>
                </div>

                <p id="reset-account" class="text-center text-sm text-gray-400 mb-6 hidden"></p>

                <form id="reset-form" class="space-y-5">
                    <div>
                        <label for="reset-password" class="block font-heading text-xs sm:text-sm font-bold text-ncst-gold uppercase tracking-wider mb-2">New Password</label>
                        <div class="relative">
                            <input id="reset-password" type="password" autocomplete="new-password" minlength="6" required class="w-full px-4 pr-12 py-3 border border-ncst-gold/30 text-white placeholder-gray-500 focus:outline-none transition-all duration-300 min-h-[44px]" placeholder="At least 6 characters">
                            <button type="button" class="password-toggle-btn absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-ncst-neon transition-colors" data-target="reset-password" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
                        </div>
                    </div>
                    <div>
                        <label for="reset-confirm-password" class="block font-heading text-xs sm:text-sm font-bold text-ncst-gold uppercase tracking-wider mb-2">Confirm New Password</label>
                        <div class="relative">
                            <input id="reset-confirm-password" type="password" autocomplete="new-password" minlength="6" required class="w-full px-4 pr-12 py-3 border border-ncst-gold/30 text-white placeholder-gray-500 focus:outline-none transition-all duration-300 min-h-[44px]" placeholder="Repeat your new password">
                            <button type="button" class="password-toggle-btn absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-ncst-neon transition-colors" data-target="reset-confirm-password" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
                        </div>
                    </div>
                    <p id="reset-error" class="hidden text-sm text-red-300" role="alert"></p>
                    <button id="reset-submit" type="submit" class="rune-btn w-full">
                        <i class="fa-solid fa-wand-sparkles"></i> Seal New Password
                    </button>
                </form>
            </div>

            <div id="reset-success-state" class="text-center hidden">
                <div class="w-16 h-16 mx-auto mb-6 rounded-full bg-green-500/20 flex items-center justify-center">
                    <i class="fa-solid fa-check text-green-400 text-2xl"></i>
                </div>
                <h2 class="font-magic text-2xl sm:text-3xl text-ncst-gold text-gold-glow mb-2">Spell Restored!</h2>
                <p class="font-flavor italic text-sm mb-6" style="color:#a08060;">Your password has been changed. You may now return to the academy.</p>
                <a href="auth.html" class="rune-btn w-full">Return to Login</a>
            </div>

            <div id="reset-error-state" class="text-center hidden">
                <div class="wax-seal mx-auto mb-6"><i class="fa-solid fa-triangle-exclamation"></i></div>
                <h2 class="font-magic text-2xl sm:text-3xl text-ncst-gold text-gold-glow mb-2">Scroll Unavailable</h2>
                <p id="reset-fatal-error" class="font-flavor italic text-sm mb-6" style="color:#a08060;"></p>
                <a href="auth.html" class="iron-plaque-btn w-full">Request a New Link</a>
            </div>
        </section>
    </main>

    <script src="assets/js/reset.js" defer></script>
</body>
</html>
