<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Wizard - Top-Up Credits</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../assets/js/tailwind-config.js"></script>
    <link rel="stylesheet" href="../assets/css/style.css">

    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js"></script>
    <script src="../assets/js/firebaseConfig.js"></script>
    <script src="../assets/js/authService.js"></script>
    <script src="../assets/js/playerService.js"></script>
    <script src="../assets/js/topup.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600;6..96,700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="antialiased selection:bg-ncst-neon selection:text-ncst-dark">
    <div class="fixed inset-0 pointer-events-none z-0">
        <div class="absolute inset-0 bg-tech-grid"></div>
        <div class="absolute top-0 right-0 w-[360px] h-[360px] bg-ncst-blue rounded-full filter blur-[120px] opacity-20"></div>
        <div class="absolute bottom-0 left-0 w-[360px] h-[360px] bg-ncst-gold rounded-full filter blur-[120px] opacity-10"></div>
    </div>

    <nav class="fixed top-0 w-full z-50 bg-ncst-dark/95 border-b border-ncst-neon/20" style="box-shadow: 0 2px 20px rgba(0,0,0,0.8), 0 1px 0 rgba(201,168,76,0.1);">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 sm:h-20 flex justify-between items-center">
            <a href="../index.html" class="flex items-center gap-2 sm:gap-3 logo-container group hover:opacity-90 transition-opacity">
                <img src="../assets/img/logo.png" alt="Math Wizard Logo" class="w-8 sm:w-10 h-8 sm:h-10 logo-image transition-all duration-500 group-hover:drop-shadow-[0_0_8px_#C9A84C]">
                <div>
                    <h1 class="font-magic text-lg sm:text-xl text-white tracking-widest">Math<span class="text-ncst-gold">Wizard</span></h1>
                    <p class="text-[0.5rem] sm:text-[0.6rem] uppercase tracking-[0.2em] text-ncst-neon font-bold">The Era Of Mages</p>
                </div>
            </a>
            <div class="hidden md:flex items-center gap-6">
                <a href="../profile.html" class="text-sm uppercase tracking-widest text-ncst-neon hover:text-ncst-gold transition-colors">Profile</a>
                <a href="top-up.html" class="text-sm uppercase tracking-widest text-ncst-gold font-bold">Top-Up</a>
            </div>
        </div>
    </nav>

    <main class="relative z-10 pt-28 pb-20 px-4 sm:px-6">
        <section class="max-w-6xl mx-auto">
            <div class="text-center mb-8 sm:mb-10">
                <div class="section-tag inline-flex items-center gap-2 mb-3"><i class="fa-solid fa-coins"></i> Merchant District</div>
                <h2 class="font-magic text-4xl sm:text-5xl text-white text-gold-glow">Top-Up Credits</h2>
                <p class="font-flavor italic text-sm sm:text-base text-gray-300 mt-2">Secure checkout via PayMongo with GCash or PayMaya.</p>
            </div>

            <div id="status-banner" class="hidden mb-6 p-4 border bg-ncst-dark/50 text-sm sm:text-base font-semibold"></div>

            <div class="grid lg:grid-cols-3 gap-6 lg:gap-8">
                <aside class="order-1 lg:order-1 lg:col-span-1 space-y-4 lg:sticky lg:top-24 lg:self-start">
                    <div class="parchment-panel p-5 sm:p-6">
                        <h3 class="font-heading text-sm uppercase tracking-widest text-ncst-gold mb-3">Current Balance</h3>
                        <div class="border border-ncst-neon/30 p-3 bg-ncst-dark/40">
                            <div class="flex items-center justify-between gap-3">
                                <div>
                                    <p class="text-[0.65rem] uppercase tracking-widest text-gray-400">Gold Coins</p>
                                    <p id="balance-gold" class="text-lg font-bold text-white">0</p>
                                </div>
                                <img src="../assets/img/ICON_PremiumCurrency.png" alt="Premium currency" class="w-10 h-10 object-contain">
                            </div>
                        </div>
                        <button id="refresh-balance-btn" type="button" class="w-full mt-3 border border-ncst-gold/30 px-3 py-2 text-xs uppercase tracking-widest text-ncst-neon hover:text-ncst-gold hover:border-ncst-gold/60 transition-colors">
                            Refresh Balance
                        </button>
                        <p id="balance-message" class="text-xs min-h-[1.25rem] mt-3 text-gray-300">Sign in to load your account balance.</p>
                    </div>

                    <div class="parchment-panel p-5 sm:p-6">
                        <h3 class="font-heading text-sm uppercase tracking-widest text-ncst-gold mb-3">Step 1: Identify Account</h3>
                        <form id="identity-form" class="space-y-4" novalidate>
                            <div>
                                <label for="username" class="block text-xs uppercase tracking-widest text-ncst-neon mb-1">Username</label>
                                <input id="username" name="username" type="text" maxlength="32" autocomplete="username" class="w-full bg-ncst-dark/60 border border-ncst-gold/30 focus:border-ncst-gold focus:ring-1 focus:ring-ncst-gold/40 outline-none px-3 py-2 text-white" placeholder="e.g. MageRico" required>
                            </div>
                            <div>
                                <label for="user-id" class="block text-xs uppercase tracking-widest text-ncst-neon mb-1">User ID</label>
                                <input id="user-id" name="userId" type="text" maxlength="40" class="w-full bg-ncst-dark/60 border border-ncst-gold/30 focus:border-ncst-gold focus:ring-1 focus:ring-ncst-gold/40 outline-none px-3 py-2 text-white" placeholder="e.g. player_1029" required>
                            </div>
                            <button type="submit" class="w-full rune-btn justify-center">
                                <i class="fa-solid fa-shield-halved"></i> Confirm Identity
                            </button>
                            <p id="identity-message" class="text-xs min-h-[1.25rem] text-gray-300"></p>
                        </form>
                    </div>

                </aside>

                <section class="order-3 lg:order-2 lg:col-span-2">
                    <div class="parchment-panel p-5 sm:p-6">
                        <div class="flex items-center justify-between gap-3 mb-5">
                            <h3 class="font-heading text-sm uppercase tracking-widest text-ncst-gold">Step 3: Select Currency Offer</h3>
                            <span id="offer-count" class="text-xs text-gray-300"></span>
                        </div>
                        <div id="offers-grid" class="grid sm:grid-cols-2 gap-4"></div>
                        <div class="mt-5 pt-4 border-t border-ncst-neon/20">
                            <button id="review-btn" type="button" class="w-full sm:w-auto iron-plaque-btn justify-center disabled:opacity-60 disabled:cursor-not-allowed" disabled>
                                <i class="fa-solid fa-arrow-right"></i> Proceed
                            </button>
                            <p id="review-message" class="text-xs min-h-[1.25rem] mt-2 text-gray-300"></p>
                        </div>
                    </div>
                </section>

                <section class="order-2 lg:order-3 lg:col-span-1">
                    <div class="parchment-panel p-5 sm:p-6">
                        <h3 class="font-heading text-sm uppercase tracking-widest text-ncst-gold mb-3">Step 2: Payment Method</h3>
                        <div class="space-y-2" id="payment-methods">
                            <label class="payment-method-option flex items-center gap-2 p-2 border border-ncst-neon/30 cursor-pointer bg-ncst-dark/30 transition-colors">
                                <input type="radio" name="paymentMethod" value="gcash" class="accent-yellow-500" checked>
                                <i class="fa-solid fa-mobile-screen-button text-ncst-neon"></i>
                                <span class="text-sm text-white">GCash</span>
                            </label>
                            <label class="payment-method-option flex items-center gap-2 p-2 border border-ncst-neon/30 cursor-pointer bg-ncst-dark/30 transition-colors">
                                <input type="radio" name="paymentMethod" value="paymaya" class="accent-yellow-500">
                                <i class="fa-solid fa-wallet text-ncst-neon"></i>
                                <span class="text-sm text-white">PayMaya</span>
                            </label>
                        </div>
                    </div>
                </section>
            </div>
        </section>
    </main>
</body>
</html>
